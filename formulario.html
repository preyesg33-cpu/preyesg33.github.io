<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura de texto</title>
    <link rel="icon" type="image/gif/png/jpg" href="img/milo.jpg">
</head>
<body>
    <form>
        Nombre:<input type="text" name="nombre">
        <br><br><br>
        Apellido:<input type="text" name="apellido">
        <br><br>
        <hr>
        <br>
        Usuario:<input type="text" name="usuario">
        <br><br><br>
        Contraseña:<input type="password" name="pass">
        <br><br><br>
        Descripcion:<textarea row="5" cols="60" name="descripcion">Escriba aqui sus comentarios</textarea>>
        <br><br>
        <hr>
        <br>

        <input type="checkbox" name="Minecraft" value="on"> Minecraft</imput>
        <br>
        <input type="checkbox" name="GTA" value="on"> GTA</imput>
        <br>
        <input type="checkbox" name="Roblox" value="on">Roblox</imput>
        <br>


        <br><br>
        <hr>
        <br>

        <input type="radio" name="subject" value="efectivo" checked> Efectivo</imput>
        <br>
        <input type="radio" name="subject" value="tarjetaC"> Tarjeta de Credito</imput>
        <br>
        <input type="radio" name="subject" value="tarjetaD">Tarjeta de Debito</imput>
        <br>
        <input type="radio" name="subject" value="caballo">Caballo</imput>
        <br>
        <input type="radio" name="subject" value="criptos">Criptomonedas</imput>
        <br>

        <br><br>
        <hr>
        <br>

        <h3>Selecciona una opcion</h3>
        <select name="listado ">
            <option value="burritos" selected>Burritos</option>
            <br>
            <option value="hamburguesa">Hamburguesas del Rio</option>
            <br>
            <option value="papas">Paposhkas</option>
            <br>
            <option value="gringas">Gringas</option>
        </select>
        <br><br>
        <hr>
        <br>

        <input type="submit" name="enviar" value="Enviar">
        <input type="reset" name="borrar" value="Borrar">
        <input type="button" name="ok" value="OK">
    </form>
</body>
</html>
