<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static DIV</title>
    <link rel="icon" type="image/gif/png/jpg" href="img/milo.jpg">

    <style>
        div.estatico{
            position:static;
            border: 3px solid blue;
        }
    </style>
</head>
<body>
    <h2>Posicion del DIV: static</h2>
    <p>Un elemento con posicion estatica no se ubica de ninguna forma
        especial, se ubica siempre segun el flujo normal de la pagina
    </p>
    
    <div class="estatico">
        <p>Este elemento DIV tiene asignada la posicion: <b><i>static;</i></b></p>
    </div>

</body>
</html>
