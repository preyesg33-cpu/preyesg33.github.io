<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagenes y texto</title> <!-- Titulo de la pagina -->
   <link rel="icon" type="image/gif/png/jpg" href="img/milo.jpg">  <!-- Icono de la pagina -->
</head>
<body>
    <!-- Niveles de encabezado -->
    <h1>Este es un texto de encabezado <i>nivel 1</i></h1>
    <h2>Este es un texto de encabezado <i>nivel 2</i></h2>
    <h3>Este es un texto de encabezado <i>nivel 3</i></h3>
    <h4>Este es un texto de encabezado <i>nivel 4</i></h4>
    <h5>Este es un texto de encabezado <i>nivel 5</i></h5>
    <br/>
    <h2>Combinando imagenes y texto</h2>
    <img title="milo" alt="Saluda a milo" src="img/milo.jpg"/> <!-- Imagen en la pagina -->
    <br/>
    <p>Texto <img title="milo" alt="Hola milo" src="img/milo.jpg"/>Otro texto</p> <!-- Imagen entre texto -->

    

</body>
</html>
