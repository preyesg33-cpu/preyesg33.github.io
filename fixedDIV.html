<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed DIV</title>
    <link rel="icon" type="image/gif/png/jpg" href="img/milo.jpg">

    <style>
        div.fijo{
            position: fixed;
            bottom: 0;
            right: 0;
            width: 400px;
            border: 3px solid red;
        }
    </style>
</head>
<body>
    <h2>Posicion del DIV: fixed</h2>

    <p>Un elemento con posicion fija se ubica de manera relativa a la vista del navegador
        (viewport), lo que significa que siempre permanece en el mismo lugar aunque
        se mueva la pagina (scroll)

    </p>

    <div class="fijo">
        <p>Este elemento DIV tiene asignada la posicion: <b><i>fixed;</i></b></p>
    </div>

</body>
</html>
