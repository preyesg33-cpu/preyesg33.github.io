<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reubicacion</title>
    <link rel="icon" type="image/gif/png/jpg" href="img/milo.jpg">
    <style>
        div{
            width: 300px;
            height: 100px;
            background-color: cyan;
            border: 3px solid black;
            transform: translate(50px,100px);
        }

    </style>
</head>
<body>
    <h2>Reubicando en un DIV</h2>
    <p>Se puede transformar la posicion de un DIV con el metodo trasladar: </p>

    <div>
        El metodo translate() altera la posicion original de un elemento.
        El elemento DIV que se muestra aqui, esta movido 50 pixeles a la derecha
        y 100 pixeles hacia abajo, a partir de su posicion original.
    </div>
</body>
</html>
