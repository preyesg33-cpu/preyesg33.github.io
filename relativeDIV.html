<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relative DIV</title>
    <link rel="icon" type="image/gif/png/jpg" href="img/milo.jpg">

    <style>
        div.relativo{
            position: relative;
            left: 30px;
            border: 5px solid green;
        }
    </style>

</head>
<body>
    <h2>Posicion del DIV: relative;</h2>

    <p>Un elemento con posicion relativa se puede ubicar de manera relativa
        a su posicion original, y se puede modificar su ubicacion desde css
    
    </p>

    <div class="relativo">
        <p>
            Este elemento DIV tiene asignada la posicion: <b><i>relative;</i></b>
        </p>
    </div>

</body>
</html>
